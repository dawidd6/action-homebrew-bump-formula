name: Close Pull Request

on:
  pull_request:
    types:
      - opened
    paths:
      - "Formula/*.rb"

concurrency:
  group: close-pr
  cancel-in-progress: false

jobs:
  close-pr:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Close
        env:
          GH_TOKEN: ${{github.token}}
          PR: ${{github.event.pull_request.number}}
        run: gh pr close --delete-branch --repo "$GITHUB_REPOSITORY" "$PR"
